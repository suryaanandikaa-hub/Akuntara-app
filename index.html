<body class="bg-slate-50 text-slate-800 antialiased selection:bg-brand-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Configuration Gemini API
        const apiKey = ""; // API Key disuntikkan secara otomatis pada runtime lingkungan

        // Utility: Exponential Backoff Fetch Gemini
        async function fetchGeminiAI(prompt, systemInstruction = "") {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: systemInstruction ? { parts: [{ text: systemInstruction }] } : undefined
            };

            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < delays.length; i++) {
                try {
                    const res = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    if (res.ok) {
                        const data = await res.json();
                        return data.candidates?.[0]?.content?.parts?.[0]?.text || "Maaf, TARA-AI belum dapat memberikan tanggapan saat ini.";
                    }
                } catch (err) {
                    // Retry silently
                }
                await new Promise(r => setTimeout(r, delays[i]));
            }
            throw new Error("Gagal menghubungkan ke layanan TARA-AI setelah beberapa kali percobaan.");
        }

        // Custom Toast Notification
        function Toast({ message, type, onClose }) {
            if (!message) return null;
            return (
                <div className={`fixed bottom-5 right-5 z-50 flex items-center space-x-3 px-4 py-3 rounded-xl shadow-xl text-white transition-all transform duration-300 ${type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`}>
                    <i data-lucide={type === 'error' ? 'alert-circle' : 'check-circle'} className="w-5 h-5"></i>
                    <span className="text-sm font-medium">{message}</span>
                    <button onClick={onClose} className="ml-2 hover:opacity-75">
                        <i data-lucide="x" className="w-4 h-4"></i>
                    </button>
                </div>
            );
        }

        // --- MAIN APP COMPONENT ---
        function App() {
            const [view, setView] = useState('landing'); // 'landing' or 'dashboard'
            const [dashTab, setDashTab] = useState('overview'); // 'overview', 'tara-fin', 'tara-score', 'tara-ai'
            const [toast, setToast] = useState({ message: '', type: 'success' });

            // State Data Keuangan Demo (TARA-FIN)
            const [transactions, setTransactions] = useState([
                { id: 1, date: '2026-08-25', desc: 'Penjualan Paket Kuliner Organik', amount: 3500000, type: 'income', category: 'Penjualan Utama' },
                { id: 2, date: '2026-08-26', desc: 'Pembelian Bahan Kemasan Compostable', amount: 650000, type: 'expense', category: 'Kemasan Hijau' },
                { id: 3, date: '2026-08-27', desc: 'Biaya Pengolahan Limbah Minyak (Zero Waste Bali)', amount: 200000, type: 'expense', category: 'Biaya Lingkungan' },
                { id: 4, date: '2026-08-28', desc: 'Listrik Hemat Energi LED & Panel Surya', amount: 450000, type: 'expense', category: 'Energi' }
            ]);

            // State TARA-SCORE Form
            const [scoreMetrics, setScoreMetrics] = useState({
                energyUsage: 80, // % penggunaan efisiensi
                wasteManagement: 75, // % daur ulang/pemilahan
                greenMaterials: 90, // % bahan alami/lokal
                waterEfficiency: 70, // % hemat air
                greenAccounting: 65 // % pencatatan biaya lingkungan
            });

            // State TARA-AI Chat
            const [chatMessages, setChatMessages] = useState([
                { sender: 'ai', text: 'Om Swastyastu! Saya TARA-AI, asisten rekomendasi keberlanjutan & efisiensi biaya UMKM Anda. Ada yang bisa saya bantu terkait pengelolaan efisiensi usaha hijau Anda hari ini?' }
            ]);
            const [inputChat, setInputChat] = useState('');
            const [loadingAi, setLoadingAi] = useState(false);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [view, dashTab, transactions, chatMessages, scoreMetrics]);

            const showToast = (msg, type = 'success') => {
                setToast({ message: msg, type });
                setTimeout(() => setToast({ message: '', type: 'success' }), 4000);
            };

            // Calculate Financials
            const totalIncome = transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
            const totalExpense = transactions.filter(t => t.type === 'expense').reduce((acc, t) => acc + t.amount, 0);
            const greenExpenses = transactions.filter(t => t.type === 'expense' && ['Kemasan Hijau', 'Biaya Lingkungan', 'Energi'].includes(t.category)).reduce((acc, t) => acc + t.amount, 0);
            const netProfit = totalIncome - totalExpense;

            // Calculate Overall TARA-SCORE
            const overallScore = Math.round(
                (scoreMetrics.energyUsage + scoreMetrics.wasteManagement + scoreMetrics.greenMaterials + scoreMetrics.waterEfficiency + scoreMetrics.greenAccounting) / 5
            );

            // Handler Add Transaction
            const handleAddTransaction = (e) => {
                e.preventDefault();
                const form = e.target;
                const newTx = {
                    id: Date.now(),
                    date: form.date.value || new Date().toISOString().split('T')[0],
                    desc: form.desc.value,
                    amount: parseFloat(form.amount.value),
                    type: form.type.value,
                    category: form.category.value
                };
                setTransactions([newTx, ...transactions]);
                form.reset();
                showToast('Transaksi berhasil ditambahkan ke TARA-FIN!');
            };

            // Handler AI Chat
            const handleSendChat = async () => {
                if (!inputChat.trim() || loadingAi) return;
                const userMsg = inputChat;
                setInputChat('');
                setChatMessages(prev => [...prev, { sender: 'user', text: userMsg }]);
                setLoadingAi(true);

                const systemPrompt = `Anda adalah TARA-AI, konsultan kecerdasan buatan terintegrasi untuk platform AKUNTARA Bali. Tugas Anda adalah memberikan saran praktis, terukur, dan bersahabat bagi UMKM Kuliner, Kerajinan, & Fashion di Bali mengenai Green Accounting, efisiensi energi/air, pengelolaan limbah zero-waste, serta strategi biaya usaha. Gunakan nada bicara ramah, profesional, serta mendukung iklim UMKM Hijau Bali.`;
                
                const contextPrompt = `Konteks Keberlanjutan UMKM Pengguna:
- TARA-SCORE Keberlanjutan Usaha: ${overallScore}/100

Pertanyaan/Pesan UMKM: ${userMsg}`;

                try {
                    const aiReply = await fetchGeminiAI(contextPrompt, systemPrompt);
                    setChatMessages(prev => [...prev, { sender: 'ai', text: aiReply }]);
                } catch (err) {
                    setChatMessages(prev => [...prev, { sender: 'ai', text: 'Mohon maaf, terjadi kendala koneksi ke TARA-AI. Silakan coba kembali sejenak lagi.' }]);
                    showToast('Gagal memproses rekomendasi AI', 'error');
                } finally {
                    setLoadingAi(false);
                }
            };

            return (

                    {/* NAVBAR */}
                    <header className="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200">

                                </div>
                                <div>

                                    </span>
                                    <span className="block text-[10px] uppercase font-bold tracking-widest text-emerald-600">
                                        Green Accounting & Sustainability
                                    </span>
                                </div>
                            </div>

                            {/* Nav Buttons */}
                            <div className="flex items-center space-x-3 sm:space-x-4">
                                <button
                                    onClick={() => setView('landing')}
                                    className={`px-4 py-2 text-sm font-semibold rounded-lg transition-all ${view === 'landing' ? 'text-brand-700 bg-brand-50' : 'text-slate-600 hover:text-brand-600'}`}
                                >
                                    Beranda Utama
                                </button>
                                <button
                                    onClick={() => setView('dashboard')}
                                    className={`px-5 py-2.5 text-sm font-semibold rounded-xl shadow-md transition-all flex items-center space-x-2 ${view === 'dashboard' ? 'bg-brand-700 text-white shadow-emerald-700/30 ring-2 ring-brand-500 ring-offset-2' : 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-emerald-600/20'}`}
                                >
                                    <i data-lucide="layout-dashboard" className="w-4 h-4"></i>
                                    <span>Coba Demo App (TARA)</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* CONTENT BODY */}
                    <main className="flex-grow">
                        {view === 'landing' ? (
                            <LandingPage 
                                onOpenDemo={() => setView('dashboard')} 
                                overallScore={overallScore} 
                            />
                        ) : (
                            <DashboardView 
                                dashTab={dashTab}
                                setDashTab={setDashTab}
                                transactions={transactions}
                                handleAddTransaction={handleAddTransaction}
                                scoreMetrics={scoreMetrics}
                                setScoreMetrics={setScoreMetrics}
                                overallScore={overallScore}
                                chatMessages={chatMessages}
                                inputChat={inputChat}
                                setInputChat={setInputChat}
                                handleSendChat={handleSendChat}
                                loadingAi={loadingAi}
                                showToast={showToast}
                            />
                        )}
                    </main>

                    {/* FOOTER */}
                    <footer className="bg-slate-900 text-slate-400 py-12 border-t border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-4 gap-8">
                            <div className="space-y-4 md:col-span-1">
                                <div className="flex items-center space-x-2">
                                    <div className="w-8 h-8 bg-brand-500 rounded-lg flex items-center justify-center text-white">
                                        <i data-lucide="leaf" className="w-5 h-5"></i>
                                    </div>
                                    <span className="text-xl font-bold text-white tracking-wide">AKUNTARA</span>
                                </div>
                                <p className="text-xs leading-relaxed text-slate-400">
                                    Platform Akuntansi dan Keberlanjutan Terintegrasi untuk membantu UMKM mikro & kecil Bali mengukur, mengelola, serta meningkatkan kinerja keberlanjutan berbasis data.
                                </p>
                            </div>

                            <div>

                                <ul className="space-y-2 text-xs">

                                    <li className="hover:text-emerald-400 cursor-pointer" onClick={() => { setView('dashboard'); setDashTab('tara-score'); }}>TARA-SCORE (Sustainability Index)</li>
                                    <li className="hover:text-emerald-400 cursor-pointer" onClick={() => { setView('dashboard'); setDashTab('tara-ai'); }}>TARA-AI (Konsultan AI Hijau)</li>
                                    <li className="hover:text-emerald-400 cursor-pointer">Laporan Keuangan & Biaya Lingkungan</li>
                                </ul>
                            </div>


                        </div>

                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-12 pt-6 border-t border-slate-800 text-center text-xs text-slate-500 flex flex-col sm:flex-row justify-between items-center">
                            <p>© 2026 AKUNTARA Platform. Hak Cipta Dilindungi Undang-Undang.</p>
                            <p className="mt-2 sm:mt-0 text-slate-400">Denpasar • Gianyar • Tabanan • Buleleng • Bali</p>
                        </div>
                    </footer>
                </div>
            );
        }

        // --- LANDING PAGE COMPONENT ---

                <div className="space-y-20 pb-16">
                    {/* HERO SECTION */}
                    <section className="relative overflow-hidden pt-12 pb-20 hero-gradient">

                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">

                                    <div className="inline-flex items-center space-x-2 bg-emerald-100/80 border border-emerald-300 text-emerald-800 px-3.5 py-1.5 rounded-full text-xs font-bold tracking-wide">
                                        <i data-lucide="sparkles" className="w-4 h-4 text-emerald-600"></i>
                                        <span>Inkubasi Hijau UMKM Bali 2026</span>
                                    </div>
                                    <h1 className="text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight text-slate-900 leading-tight">
                                        Transformasi UMKM Bali Menuju <span className="bg-gradient-to-r from-emerald-600 via-teal-600 to-brand-800 bg-clip-text text-transparent">Hijau & Terukur</span>
                                    </h1>
                                    <p className="text-base sm:text-lg text-slate-600 leading-relaxed max-w-2xl mx-auto lg:mx-0">
                                        AKUNTARA mengintegrasikan pencatatan keuangan modern (<strong>TARA-FIN</strong>), pengukuran indikator keberlanjutan (<strong>TARA-SCORE</strong>), dan rekomendasi pintar (<strong>TARA-AI</strong>) untuk efisiensi biaya serta daya saing bisnis ramah lingkungan.
                                    </p>

                                    <div className="pt-2 flex flex-col sm:flex-row items-center justify-center lg:justify-start space-y-3 sm:space-y-0 sm:space-x-4">
                                        <button
                                            onClick={onOpenDemo}
                                            className="w-full sm:w-auto px-8 py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl shadow-lg shadow-emerald-600/30 transition-all transform hover:-translate-y-0.5 flex items-center justify-center space-x-3 text-base"
                                        >
                                            <i data-lucide="play-circle" className="w-5 h-5"></i>
                                            <span>Mulai Coba Demo Platform</span>
                                        </button>
                                        <a
                                            href="#fitur"

                                        >
                                            Pelajari Fitur
                                        </a>
                                    </div>

                                    {/* Indikator Poin Kunci Proposal */}
                                    <div className="pt-6 grid grid-cols-3 gap-4 border-t border-slate-200/80 max-w-lg mx-auto lg:mx-0">
                                        <div>
                                            <div className="text-2xl font-extrabold text-slate-900">146.8</div>
                                            <div className="text-xs font-medium text-slate-500">Indeks UMKM Hijau (BI 2024)</div>
                                        </div>
                                        <div>
                                            <div className="text-2xl font-extrabold text-emerald-600">60.5%</div>
                                            <div className="text-xs font-medium text-slate-500">Kontribusi PDB UMKM</div>
                                        </div>
                                        <div>
                                            <div className="text-2xl font-extrabold text-teal-600">448k+</div>
                                            <div className="text-xs font-medium text-slate-500">Potensi UMKM Bali</div>

                                {/* Visual Hero Preview Card */}

                                    <div className="relative mx-auto max-w-md lg:max-w-none">

                                                        <i data-lucide="store" className="w-5 h-5"></i>

                                                    <span className="inline-block mt-2 px-2 py-0.5 bg-emerald-500/20 text-emerald-300 text-[10px] rounded font-medium border border-emerald-500/30">
                                                        Sangat Baik • Praktik Hijau Terverifikasi

                                                <div>

                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* FITUR UTAMA SECTION */}

                                <div className="lg:col-span-7 space-y-6 text-xs font-semibold text-slate-700">
                                    <div>
                                        <div className="flex justify-between mb-1">
                                            <span>Efisiensi Energi (Penggunaan LED, Solar, Penghematan Listrik)</span>
                                            <span className="text-emerald-700 font-bold">{scoreMetrics.energyUsage}%</span>
                                        </div>
                                        <input
                                            type="range"
                                            min="0"
                                            max="100"
                                            value={scoreMetrics.energyUsage}
                                            onChange={(e) => setScoreMetrics({ ...scoreMetrics, energyUsage: Number(e.target.value) })}
                                            className="w-full accent-emerald-600 cursor-pointer"
                                        />
                                    </div>

                                    <div>
                                        <div className="flex justify-between mb-1">
                                            <span>Pengelolaan Limbah & Zero Waste (Pemilahan & Daur Ulang)</span>
                                            <span className="text-teal-700 font-bold">{scoreMetrics.wasteManagement}%</span>
                                        </div>
                                        <input
                                            type="range"
                                            min="0"
                                            max="100"
                                            value={scoreMetrics.wasteManagement}
                                            onChange={(e) => setScoreMetrics({ ...scoreMetrics, wasteManagement: Number(e.target.value) })}
                                            className="w-full accent-teal-600 cursor-pointer"
                                        />
                                    </div>

                                    <div>
                                        <div className="flex justify-between mb-1">
                                            <span>Bahan Baku Alam & Kemasan Hijau (Bebas Plastik Sekali Pakai)</span>
                                            <span className="text-emerald-700 font-bold">{scoreMetrics.greenMaterials}%</span>
                                        </div>
                                        <input
                                            type="range"
                                            min="0"
                                            max="100"
                                            value={scoreMetrics.greenMaterials}
                                            onChange={(e) => setScoreMetrics({ ...scoreMetrics, greenMaterials: Number(e.target.value) })}
                                            className="w-full accent-emerald-600 cursor-pointer"
                                        />
                                    </div>

                                    <div>
                                        <div className="flex justify-between mb-1">
                                            <span>Efisiensi Penggunaan Air Operasional</span>
                                            <span className="text-teal-700 font-bold">{scoreMetrics.waterEfficiency}%</span>
                                        </div>
                                        <input
                                            type="range"
                                            min="0"
                                            max="100"
                                            value={scoreMetrics.waterEfficiency}
                                            onChange={(e) => setScoreMetrics({ ...scoreMetrics, waterEfficiency: Number(e.target.value) })}
                                            className="w-full accent-teal-600 cursor-pointer"
                                        />
                                    </div>

                                    <div>
                                        <div className="flex justify-between mb-1">
                                            <span>Kedisiplinan Green Accounting (Pencatatan Biaya Lingkungan)</span>
                                            <span className="text-amber-700 font-bold">{scoreMetrics.greenAccounting}%</span>
                                        </div>
                                        <input
                                            type="range"
                                            min="0"
                                            max="100"
                                            value={scoreMetrics.greenAccounting}
                                            onChange={(e) => setScoreMetrics({ ...scoreMetrics, greenAccounting: Number(e.target.value) })}
                                            className="w-full accent-amber-600 cursor-pointer"
                                        />
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAB CONTENT: TARA-AI (KONSULTAN AI) */}
                    {dashTab === 'tara-ai' && (
                        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col h-[600px]">
                            {/* AI Header */}
                            <div className="bg-slate-900 text-white px-6 py-4 flex items-center justify-between border-b border-slate-800">
                                <div className="flex items-center space-x-3">
                                    <div className="w-10 h-10 rounded-xl bg-amber-400 text-slate-950 flex items-center justify-center font-extrabold shadow-md">
                                        <i data-lucide="bot" className="w-6 h-6"></i>
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-sm text-white">TARA-AI Assistant</h3>
                                        <span className="text-[10px] text-emerald-400 font-medium">Terhubung dengan data TARA-FIN & TARA-SCORE Anda</span>
                                    </div>
                                </div>
                                <span className="text-[10px] bg-slate-800 text-slate-300 px-3 py-1 rounded-full">Gemini 2.5 Flash Powered</span>
                            </div>

                            {/* Chat Window */}
                            <div className="flex-1 p-6 overflow-y-auto space-y-4 bg-slate-50 text-xs">
                                {chatMessages.map((msg, idx) => (
                                    <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`max-w-lg p-4 rounded-2xl shadow-sm leading-relaxed ${msg.sender === 'user' ? 'bg-emerald-600 text-white rounded-tr-none' : 'bg-white text-slate-800 border border-slate-200 rounded-tl-none space-y-1'}`}>
                                            {msg.sender === 'ai' && (
                                                <div className="font-bold text-amber-600 mb-1 flex items-center space-x-1 text-[11px]">
                                                    <i data-lucide="sparkles" className="w-3.5 h-3.5"></i>
                                                    <span>TARA-AI</span>
                                                </div>
                                            )}
                                            <p className="whitespace-pre-line">{msg.text}</p>
                                        </div>
                                    </div>
                                ))}
                                {loadingAi && (
                                    <div className="flex justify-start">
                                        <div className="bg-white border border-slate-200 text-slate-600 p-4 rounded-2xl rounded-tl-none flex items-center space-x-2">
                                            <div className="w-2 h-2 bg-emerald-500 rounded-full animate-ping"></div>
                                            <span className="font-medium">TARA-AI sedang menganalisis data usaha Anda...</span>
                                        </div>
                                    </div>
                                )}
                                <div ref={chatBottomRef} />
                            </div>

                            {/* Input Form */}
                            <div className="p-4 bg-white border-t border-slate-200">
                                <form onSubmit={(e) => { e.preventDefault(); handleSendChat(); }} className="flex items-center space-x-2">
                                    <input
                                        type="text"
                                        value={inputChat}
                                        onChange={(e) => setInputChat(e.target.value)}
                                        placeholder="Tanyakan strategi efisiensi biaya hijau, daur ulang limbah, atau green accounting..."
                                        className="flex-1 px-4 py-3 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-emerald-500 outline-none"
                                    />
                                    <button
                                        type="submit"
                                        disabled={loadingAi}
                                        className="px-5 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow-md transition-all flex items-center space-x-2 disabled:opacity-50"
                                    >
                                        <span>Kirim</span>
                                        <i data-lucide="send" className="w-4 h-4"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Render React DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
